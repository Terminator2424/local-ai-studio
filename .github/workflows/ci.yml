name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Estilo, tipos, pruebas y seguridad
    runs-on: windows-latest        # la aplicación es de Windows (Tk, NVML, Job Objects del sandbox)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: "Instalar dependencias (sin PyTorch, ninguna prueba necesita GPU ni Ollama)"
        run: python -m pip install -r requirements-dev.txt

      - name: Estilo y errores (ruff)
        run: python -m ruff check .

      - name: Tipos (mypy)
        run: python -m mypy local_ai_studio

      - name: Pruebas con cobertura
        run: |
          python -m coverage run --source=local_ai_studio -m unittest discover -s tests -v
          python -m coverage report --skip-empty

      - name: Seguridad del código (bandit)
        run: python -m bandit -r local_ai_studio app.py -ll -q

      - name: Vulnerabilidades en dependencias (pip-audit)
        run: python -m pip_audit -r requirements.txt
        continue-on-error: true      # informa, pero un aviso nuevo de un tercero no debe bloquear un cambio ajeno
